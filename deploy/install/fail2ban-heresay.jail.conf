# Installs to /etc/fail2ban/jail.d/heresay.conf
[heresay]
enabled  = true
# ⛔ POLLING, NOT systemd. Ubuntu's default backend reads the JOURNAL, and since
# v1.30.0 the engine's domain facts are NOT in the journal — they are in its own
# event store. A jail left on the default backend runs happily and matches
# nothing, forever, with no error anywhere to say so. This one line is the
# difference between a working jail and a decorative one.
backend  = polling
filter   = heresay
logpath  = /var/lib/heresay/events.jsonl
# ⛔ THE DOORS ONLY — and note what is NOT here: 22. A ban can never touch SSH,
# whatever else goes wrong, which is what makes this safe to enable on a box you
# reach over SSH. 2323 is the raw TLS door; http/https are Caddy's, in front of
# the WebSocket door.
port     = 2323,http,https
maxretry = 6
findtime = 10m
bantime  = 1h
# ⚠ LOOPBACK ONLY, deliberately — add YOUR OWN admin address here before you
# enable it. The engine exempts loopback from its own IP bans for the same
# reason (the plaintext console is the operator at the machine); a FIREWALL ban
# is the one that can shut you out of the box, and it does not know who you are.
ignoreip = 127.0.0.1/8 ::1
