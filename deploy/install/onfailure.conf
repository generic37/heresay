# A drop-in, installed as onfailure.conf into the `.d` directory of EACH unit
# that is worth being woken up for:
#
#   heresay              the house itself
#   heresay-depscan      a dependency CVE was found (the scan FAILS on a finding)
#   heresay-backup       the nightly tarball did not get written
#   caddy                the web door and the ACME client
#   heresay-cert-copy    the :2323 cert stopped being renewed across
#
# ⚠ A DROP-IN, not an edit to the units. Three of those five are not ours at all
# (caddy) or are shipped by this repo and overwritten by the next deploy — and a
# hand-edited unit is a change that vanishes the moment the file it lives in is
# replaced. A `.d/` fragment survives both.
#
# `%n` is this unit's own name, which is what makes one template enough.
[Unit]
OnFailure=heresay-notify@%n.service
