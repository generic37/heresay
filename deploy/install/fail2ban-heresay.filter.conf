# Installs to /etc/fail2ban/filter.d/heresay.conf
#
# Matches the engine's own event log, /var/lib/heresay/events.jsonl — one JSON
# object per line, and this is the only line shape that matters here:
#
#   {"ts":1785531749.27,"type":"auth_fail","ip":"1.2.3.4","phase":"login"}
#
# ⚠ The two fields are matched ADJACENT and in order, which is how events.py
# writes them. That is deliberately tighter than allowing anything between them:
# it cannot be satisfied by an `ip` belonging to some other event type on the
# same line.
#
# ⚠ `datepattern` is the part that is easy to get wrong. The timestamp is a bare
# epoch float in a JSON field, not a syslog date; without this fail2ban cannot
# read the time, treats every line as "now", and findtime quietly stops meaning
# anything. {EPOCH} handles the fractional part.
#
# Verify after installing (11/11 auth_fail lines matched on the live box):
#   sudo fail2ban-regex /var/lib/heresay/events.jsonl \
#        /etc/fail2ban/filter.d/heresay.conf
[Definition]
failregex = "type":"auth_fail","ip":"<HOST>"
datepattern = "ts":{EPOCH}
