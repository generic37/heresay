# A drop-in for heresay-backup.service only, installed as hcping.conf into
# /etc/systemd/system/heresay-backup.service.d/.
#
# ⚠ ExecStartPost runs ONLY IF the backup itself succeeded, which is exactly the
# semantics a dead-man's-switch needs: the ping means "a tarball was written",
# not "the timer fired". A backup that fails sends nothing, and Healthchecks
# raises the alarm on the silence — while `onfailure.conf` beside this file
# buzzes the phone directly. The two are the fast path and the backstop.
[Service]
ExecStartPost=/usr/local/bin/heresay-hcping.sh success
